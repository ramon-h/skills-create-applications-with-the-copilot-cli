# Step 2 — Validate Vconfig Setup
# Triggered manually by the learner after completing the Vconfig activities
# (vconfig init, devenv skills install, devenv mcp install, and GITLAB_TOKEN CI variable creation).
# Validates that the GITLAB_TOKEN CI variable is set and functional.

.step2-defaults: &step2-defaults
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq bash
    - chmod +x .gitlab/ci/scripts/*.sh

step2:find-exercise-issue:
  <<: *step2-defaults
  stage: step2-validate-vconfig
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "trigger"
      when: always
    - when: never
  script:
    - bash .gitlab/ci/scripts/find_exercise_issue.sh
  artifacts:
    reports:
      dotenv: variables.env

step2:check-gitlab-token:
  <<: *step2-defaults
  stage: step2-validate-vconfig
  needs:
    - job: step2:find-exercise-issue
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "trigger"
      when: always
    - when: never
  script:
    - |
      API_URL="${CI_API_V4_URL:-https://gitlab.com/api/v4}"

      if [ -z "${GITLAB_TOKEN:-}" ]; then
        echo "GITLAB_TOKEN is not set as a CI/CD variable."
        echo "TOKEN_PASSED=false" >> check_results.env
        exit 0
      fi

      # Try an authenticated API call to verify the token is valid and has api scope
      HTTP_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
        --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
        "${API_URL}/projects/${CI_PROJECT_ID}")

      echo "GitLab API authentication status: HTTP ${HTTP_STATUS}"

      if [ "${HTTP_STATUS}" = "200" ]; then
        echo "✅ GITLAB_TOKEN is set and authenticated successfully"
        echo "TOKEN_PASSED=true" >> check_results.env
      else
        echo "❌ GITLAB_TOKEN authentication failed (HTTP ${HTTP_STATUS})"
        echo "TOKEN_PASSED=false" >> check_results.env
      fi
  artifacts:
    reports:
      dotenv: check_results.env

step2:post-results:
  <<: *step2-defaults
  stage: step2-validate-vconfig
  needs:
    - job: step2:find-exercise-issue
      artifacts: true
    - job: step2:check-gitlab-token
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "trigger"
      when: always
    - when: never
  variables:
    STEP_3_FILE: ".gitlab/steps/3-step.md"
  script:
    - |
      bash .gitlab/ci/scripts/post_step_results.sh "${ISSUE_IID}" "2" \
        "GITLAB_TOKEN CI variable is set and authenticated" "${TOKEN_PASSED}"
    - |
      if [ "${TOKEN_PASSED}" = "true" ]; then
        bash .gitlab/ci/scripts/post_issue_comment.sh "${ISSUE_IID}" "${STEP_3_FILE}"
      fi
