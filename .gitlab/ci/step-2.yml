# Step 2 — Validate Calculator Implementation
# Triggered when the learner pushes to the create-calc-app branch with changes to src/*.js.
# Validates that calculator.js contains comments/documentation for all four operations.

.step2-defaults: &step2-defaults
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq bash
    - chmod +x .gitlab/ci/scripts/*.sh

step2:find-exercise-issue:
  <<: *step2-defaults
  stage: step2-validate-calculator
  rules:
    - if: $CI_COMMIT_BRANCH == "create-calc-app"
      changes:
        - src/*.js
  script:
    - bash .gitlab/ci/scripts/find_exercise_issue.sh
  artifacts:
    reports:
      dotenv: variables.env

step2:check-calculator-operations:
  <<: *step2-defaults
  stage: step2-validate-calculator
  needs:
    - job: step2:find-exercise-issue
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "create-calc-app"
      changes:
        - src/*.js
  script:
    - |
      CALC_FILE="src/calculator.js"
      if [ ! -f "${CALC_FILE}" ]; then
        echo "ERROR: ${CALC_FILE} not found"
        echo "ADDITION_PASSED=false"   >> check_results.env
        echo "SUBTRACTION_PASSED=false" >> check_results.env
        echo "MULTIPLY_PASSED=false"   >> check_results.env
        echo "DIVISION_PASSED=false"   >> check_results.env
        exit 0
      fi

      bash .gitlab/ci/scripts/check_keyphrase.sh "${CALC_FILE}" "addition"      && echo "ADDITION_PASSED=true"      >> check_results.env || echo "ADDITION_PASSED=false"      >> check_results.env
      bash .gitlab/ci/scripts/check_keyphrase.sh "${CALC_FILE}" "subtraction"   && echo "SUBTRACTION_PASSED=true"   >> check_results.env || echo "SUBTRACTION_PASSED=false"   >> check_results.env
      bash .gitlab/ci/scripts/check_keyphrase.sh "${CALC_FILE}" "multiplication" && echo "MULTIPLY_PASSED=true"      >> check_results.env || echo "MULTIPLY_PASSED=false"      >> check_results.env
      bash .gitlab/ci/scripts/check_keyphrase.sh "${CALC_FILE}" "division"      && echo "DIVISION_PASSED=true"      >> check_results.env || echo "DIVISION_PASSED=false"      >> check_results.env
  artifacts:
    reports:
      dotenv: check_results.env

step2:post-results:
  <<: *step2-defaults
  stage: step2-validate-calculator
  needs:
    - job: step2:find-exercise-issue
      artifacts: true
    - job: step2:check-calculator-operations
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "create-calc-app"
      changes:
        - src/*.js
      when: always
  variables:
    STEP_3_FILE: ".gitlab/steps/3-step.md"
  script:
    - |
      bash .gitlab/ci/scripts/post_step_results.sh "${ISSUE_IID}" "2" \
        "Calculator has 'addition' function"       "${ADDITION_PASSED}" \
        "Calculator has 'subtraction' function"    "${SUBTRACTION_PASSED}" \
        "Calculator has 'multiplication' function" "${MULTIPLY_PASSED}" \
        "Calculator has 'division' function"       "${DIVISION_PASSED}"
    - |
      if [ "${ADDITION_PASSED}" = "true" ] && [ "${SUBTRACTION_PASSED}" = "true" ] && \
         [ "${MULTIPLY_PASSED}" = "true" ] && [ "${DIVISION_PASSED}" = "true" ]; then
        bash .gitlab/ci/scripts/post_issue_comment.sh "${ISSUE_IID}" "${STEP_3_FILE}"
      fi
