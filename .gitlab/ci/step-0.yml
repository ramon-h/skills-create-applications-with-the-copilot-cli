# Step 0 — Start Exercise
# Triggered on the first push to main.
# Creates the exercise issue and posts the Step 1 instructions as a comment.

.step0-defaults: &step0-defaults
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq bash
    - chmod +x .gitlab/ci/scripts/*.sh

step0:start-exercise:
  <<: *step0-defaults
  stage: step0-start
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
  variables:
    EXERCISE_TITLE: "Create applications with the Copilot CLI"
    STEP_1_FILE: ".gitlab/steps/1-step.md"
  script:
    - |
      API_URL="${CI_API_V4_URL:-https://gitlab.com/api/v4}"

      # Check if the exercise issue already exists to avoid duplicates
      EXISTING=$(curl -sf \
        --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
        "${API_URL}/projects/${CI_PROJECT_ID}/issues?state=opened&labels=education&per_page=1" \
        | jq -r '.[0].iid // empty')

      if [ -n "${EXISTING}" ]; then
        echo "Exercise issue #${EXISTING} already exists. Skipping creation."
        echo "ISSUE_IID=${EXISTING}" >> variables.env
      else
        # Create the exercise issue
        INTRO="👋 Welcome! Let's get you started with GitHub Copilot CLI!\n\nWe'll learn how to use it for issue management and building a Node.js calculator app 🚀\n\nPlease read the instructions below and follow the activities to complete this exercise."
        ISSUE_RESP=$(curl -sf \
          --request POST \
          --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
          --header "Content-Type: application/json" \
          --data "$(jq -n --arg title "${EXERCISE_TITLE}" --arg desc "$(printf "${INTRO}")" \
            '{"title": $title, "description": $desc, "labels": "education"}')" \
          "${API_URL}/projects/${CI_PROJECT_ID}/issues")

        ISSUE_IID=$(echo "${ISSUE_RESP}" | jq -r '.iid')
        echo "Created exercise issue #${ISSUE_IID}"
        echo "ISSUE_IID=${ISSUE_IID}" >> variables.env
      fi
    - source variables.env
    - bash .gitlab/ci/scripts/post_issue_comment.sh "${ISSUE_IID}" "${STEP_1_FILE}"
  artifacts:
    reports:
      dotenv: variables.env
